name: daily-recs

on:
  schedule:
    - cron: '0 1 * * 1-5'   # 08:00 WIB
    - cron: '0 9 * * 1-5'   # 16:00 WIB
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run pipeline
        run: python pipeline.py --commit
        env:
          TZ: Asia/Jakarta

      - name: Commit data (the database)
        run: |
          git config user.name "idx-daily-recs bot"
          git config user.email "actions@github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh $(TZ=Asia/Jakarta date +'%Y-%m-%d %H:%M WIB')"
            git push
          fi

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

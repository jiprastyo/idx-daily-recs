name: daily-recs

on:
  schedule:
    - cron: '0 1 * * 1-5'   # 08:00 WIB
    - cron: '0 9 * * 1-5'   # 16:00 WIB
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run pipeline
        run: python pipeline.py --commit
        env:
          TZ: Asia/Jakarta

      - name: Commit data (the database)
        run: |
          git config user.name "idx-daily-recs bot"
          git config user.email "actions@github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh $(TZ=Asia/Jakarta date +'%Y-%m-%d %H:%M WIB')"
            git push
          fi

      - name: Deploy site to gh-pages branch (Pages source = branch, no Actions quota needed)
        run: |
          git fetch origin gh-pages || true
          rm -rf /tmp/site-deploy && cp -r site /tmp/site-deploy
          git checkout --orphan gh-pages-tmp 2>/dev/null || git checkout -B gh-pages-tmp
          git rm -rf --quiet . 2>/dev/null || true
          cp -r /tmp/site-deploy/* .
          touch .nojekyll
          git add -A
          if git diff --cached --quiet; then
            echo "site unchanged, nothing to deploy"
          else
            git -c user.name="idx-daily-recs bot" -c user.email="actions@github.com" \
              commit -m "site: deploy $(TZ=Asia/Jakarta date +'%Y-%m-%d %H:%M WIB')"
            git push --force origin gh-pages-tmp:gh-pages
          fi
          git checkout main
